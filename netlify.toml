# Publicação no Netlify.
#
# O site público (montador de orçamento) é estático. No servidor só rodam as
# rotas públicas de leitura /api/catalogo e /api/recalcular (usadas pelo Orça
# Aqui), que não gravam nada — por isso não há regra de rate limit aqui.
[build]
  command = "npm run build"
  publish = ".next"

# Runtime oficial do Next para Netlify: transforma as rotas de servidor em
# Netlify Functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cabeçalhos básicos de segurança para todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
